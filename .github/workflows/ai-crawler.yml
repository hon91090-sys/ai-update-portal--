name: Realtime AI News Crawler

on:
  schedule:
    - cron: '0 * * * *' # 매 1시간마다 실행 (Runs every hour)
  workflow_dispatch: # 수동 실행 허용 (Allow manual trigger)

jobs:
  crawl-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json || backend/package.json

    - name: Install Dependencies
      working-directory: ./backend
      run: npm install

    - name: Run Crawler
      working-directory: ./backend
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: node crawler.js
