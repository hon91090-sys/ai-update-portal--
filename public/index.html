<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="page_title">AI Update Portal — 전 세계 AI 도구의 실시간 업데이트 추적</title>
  <meta name="description" data-i18n="page_desc" content="ChatGPT, Midjourney, Sora, Cursor 등 100+ AI 도구의 최신 업데이트를 AI가 자율 수집·분석하는 뉴스 포털"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>"/>
  <link rel="stylesheet" href="/css/styles.css"/>
  <script src="/js/i18n.js"></script>
</head>
<body>

<!-- ===== Top Header Bar ===== -->
<header class="top-header" id="top-header">
  <div class="header-logo" onclick="app.goHome()">
    <div class="header-logo-icon">A</div>
    <span class="header-logo-text" data-i18n="app_title">AI Portal</span>
    <span class="header-logo-badge">v2.5</span>
  </div>

  <div class="header-search">
    <svg class="header-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" class="header-search-input" id="search-input" data-i18n="search_placeholder" placeholder="Search..."/>
    <span class="header-search-kbd">⌘K</span>
  </div>

  <div class="header-tabs" id="header-tabs">
    <button class="header-tab active" data-tab="latest" data-i18n="tab_latest">최신</button>
    <button class="header-tab" data-tab="trending" data-i18n="tab_trending">인기</button>
    <button class="header-tab" data-tab="pocket" data-i18n="tab_pocket">포켓</button>
  </div>

  <div class="header-actions">
    <button class="lang-toggle-btn" id="lang-toggle" onclick="app.toggleLang()" style="font-weight:700; font-size:12px; padding:4px 8px; border:1px solid var(--border); border-radius:4px; cursor:pointer;">EN | KO</button>
    <button class="header-action-btn" title="Refresh" onclick="app.refreshFeed()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
    <button class="header-action-btn" title="Alerts" onclick="app.readNotifications()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      <span class="notification-dot" id="notification-badge"></span>
    </button>
    <button class="header-action-btn" title="Settings" onclick="app.showSettingsModal()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
    <button class="header-login-btn" id="login-trigger" onclick="app.showAuthModal()" data-i18n="btn_login">로그인</button>
  </div>
</header>

<!-- ===== App Body ===== -->
<div class="app-body" id="app-body">

  <!-- Left Sidebar -->
  <aside class="left-sidebar" id="left-sidebar"></aside>

  <!-- Main Content -->
  <main class="main-content" id="main-content"></main>

  <!-- Right Sidebar (Resizable) -->
  <aside class="right-sidebar" id="right-sidebar">
    <div class="resize-handle" id="resize-handle"></div>
  </aside>

</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/js/data.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
